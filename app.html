<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espace entreprise — Shop Entreprise FBFA</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body.theme-dark{
    --bg:#0f1420;
    --surface:#1a2233;
    --surface-2:#222c40;
    --border:#2c3650;
    --text:#e8ecf5;
    --muted:#98a2b5;
    --brand:#3b82f6;
    --brand-dark:#93c5fd;
    --brand-soft:#1e2a47;
    --ok:#34d399;
    --ok-soft:#113328;
    --warn:#fbbf24;
    --warn-soft:#3a2e0e;
    --danger:#f87171;
    --danger-soft:#3a1518;
    --sidebar:#0b111c;
  }
</style>
</head>
<body>

<div id="boot" class="center-screen"><p class="hint">Chargement de votre espace…</p></div>

<div class="app" id="app" hidden>
  <aside class="sidebar">
    <div class="brand" id="brandName"><img src="assets/logo.png" alt="FlashbackFA" style="height:28px;display:block"></div>
    <form id="globalSearchForm" style="padding:0 1rem;margin-bottom:.5rem">
      <input id="globalSearch" type="search" placeholder="🔍 Rechercher…" style="width:100%;padding:.4rem .6rem;border-radius:8px;border:1px solid #2c3650;background:#1a2233;color:#fff">
    </form>
    <nav id="nav">
      <a href="#accueil"            data-view="accueil" class="nav-co">📊 <span>Tableau de bord</span></a>
      <a href="#catalogue"          data-view="catalogue" class="nav-co">🌐 <span>Catalogue général</span></a>
      <a href="#mes-articles"       data-view="mes-articles" class="nav-co">📦 <span>Mes articles</span></a>
      <a href="#panier"             data-view="panier" class="nav-co">🛒 <span>Panier</span><span class="cart-count" id="cartCount" hidden>0</span></a>
      <a href="#achats"             data-view="achats" class="nav-co">📥 <span>Mes commandes</span></a>
      <a href="#ventes"             data-view="ventes" class="nav-co">📤 <span>Commandes reçues</span></a>
      <a href="#entreprise"         data-view="entreprise" class="nav-co">🏢 <span>Mon entreprise</span></a>
      <a href="#stats"              data-view="stats" class="nav-co">📊 <span>Statistiques</span></a>
      <a href="#devis"              data-view="devis" class="nav-co">📋 <span>Devis</span></a>
      <a href="#actualites"         data-view="actualites">📰 <span>Actualités</span></a>
      <a href="#livraisons"         data-view="livraisons" id="navDeliveries" class="nav-co" hidden>🚚 <span>Livraisons</span></a>
      <a href="#journal"            data-view="journal" id="navAuditLog" hidden>🗒️ <span>Journal staff</span></a>
      <a href="#staff"              data-view="staff" id="navStaff" hidden>🛡️ <span>Console staff</span></a>
    </nav>
    <div class="spacer"></div>
    <div class="who">
      <div id="whoCompany">—</div>
      <span id="whoEmail"></span>
      <button class="btn btn-sm btn-ghost" id="joinMoreBtn" style="margin-top:.6rem;width:100%;color:#cfd6e4">+ Rejoindre une entreprise</button>
      <button class="btn btn-sm btn-ghost" id="themeToggle" style="margin-top:.4rem;width:100%;color:#cfd6e4">🌙 Mode clair</button>
      <button class="btn btn-sm btn-ghost" id="logout" style="margin-top:.4rem;width:100%;color:#cfd6e4">Se déconnecter</button>
    </div>
  </aside>

  <main class="main" id="view"></main>
</div>

<!-- Modale générique -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <header><h2 id="modalTitle">Titre</h2><button class="x" id="modalClose" aria-label="Fermer">×</button></header>
    <div class="content" id="modalContent"></div>
  </div>
</div>

<div id="toasts"></div>

<script src="assets/js/config.js"></script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
